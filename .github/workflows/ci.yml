# Safety-net CI: proves the tree builds and passes off this machine, on Linux
# and arm64 macOS. The full local pipeline (fuzz, profiling, dogfood, publish)
# stays in cicd/cicd.bash.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: source/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet -mod=vendor ./...
      - name: test
        run: |
          set -o pipefail
          go -C ../cicd/utility/testid run . check "$GITHUB_WORKSPACE"
          { go test -mod=vendor -json ./...  &&  go -C ../cicd/utility/testid test -json .; } | go -C ../cicd/utility/testid run . report "$GITHUB_WORKSPACE"
      - name: build
        run: go build -mod=vendor ./...
      - name: smoke
        working-directory: .
        run: |
          bash cicd/build.bash
          NGDB_SMOKE_EXPECT_DATE=1 bash cicd/utility/smoke-cli.bash bin/ngdb

  # GitHub's free arm64 macOS runner. Build, test, then smoke-test the built CLI.
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: source/go.sum
      - name: arch
        run: '[ "$(uname -m)" = arm64 ] || { echo "::error::expected arm64, got $(uname -m)"; exit 1; }'
      - name: test
        run: |
          set -o pipefail
          go -C ../cicd/utility/testid run . check "$GITHUB_WORKSPACE"
          { go test -mod=vendor -json ./...  &&  go -C ../cicd/utility/testid test -json .; } | go -C ../cicd/utility/testid run . report "$GITHUB_WORKSPACE"
      - name: smoke
        working-directory: .
        run: |
          bash cicd/build.bash
          NGDB_SMOKE_EXPECT_DATE=1 bash cicd/utility/smoke-cli.bash bin/ngdb
