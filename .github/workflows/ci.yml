# Safety-net CI: proves the tree builds and passes off this machine, on Linux
# and arm64 macOS. Linux runs cicd/cicd.bash --merge-gate as far as a runner
# can: on the runner itself, with no test boxes. The full local pipeline
# (dogfood, demo, publish) stays in cicd/cicd.bash.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser's snapshot reads the tags.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: nsis
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nsis
      - name: merge gate
        run: bash cicd/cicd.bash --merge-gate --no-container --no-remote

  # GitHub's free arm64 macOS runner. Build, test, then smoke-test the built CLI.
  # Its own steps, since cicd.bash needs a newer bash than macOS has.
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: arch
        run: '[ "$(uname -m)" = arm64 ] || { echo "::error::expected arm64, got $(uname -m)"; exit 1; }'
      - name: test
        run: |
          set -o pipefail
          go -C ../cicd/utility/testid run . check "$GITHUB_WORKSPACE"
          . ../cicd/utility/include/temp-run.bash
          fakeHome="$(fTempRun_Make)"  &&  fConfigHome_Use "$fakeHome"
          { go test -mod=vendor -json ./...  &&  go -C ../cicd/utility/testid test -json .; } | go -C ../cicd/utility/testid run . report "$GITHUB_WORKSPACE"
          fConfigHome_Check "$fakeHome"
          fSafeRm "$fakeHome" > /dev/null
      - name: smoke
        working-directory: .
        run: |
          bash cicd/build.bash
          GITNIBLET_SMOKE_EXPECT_DATE=1 bash cicd/utility/smoke-cli.bash bin/gitniblet
