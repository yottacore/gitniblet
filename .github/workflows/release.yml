# Release on merge to main. The source var app.Version is authoritative. An
# already-released version stops the run cleanly (nothing to publish), a version
# that went backwards fails it, and the README version badge must agree. Past the
# guard it tags v<Version> and hands off to goreleaser to cross-build, archive,
# and publish the Release with checksums.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: source/go.sum
      - name: Guard version and badge
        id: v
        run: |
          version=$(grep -oP 'Version = "\K[^"]+' source/app/app.go | head -1)
          [ -n "$version" ] || { echo "::error::could not read Version from source/app/app.go"; exit 1; }
          tag="v${version}"
          # Increment guard. Landing on main without a bump is a legitimate no-op
          # (a doc fix or hotfix that ships nothing), so an already-released
          # version stops the run cleanly instead of failing it. A version that
          # went backwards is a real mistake and still fails below.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::notice::Version ${version} is already released (tag ${tag}); nothing to publish."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ordering note: semver puts a prerelease BELOW its release (1.0.0-rc.1
          # < 1.0.0), but neither `sort -V` nor git's version sort does that on
          # its own - both rank the longer 1.0.0-rc.1 higher. GNU sort does honour
          # the Debian "~ sorts before everything" rule, so map the prerelease
          # dash to ~ for every comparison and map it back afterwards.
          latest=$(git tag --list 'v*' | sed 's/-/~/' | sort -V | tail -1 | sed 's/~/-/')
          if [ -n "$latest" ]; then
            top=$(printf '%s\n%s\n' "$latest" "$tag" | sed 's/-/~/' | sort -V | tail -1 | sed 's/~/-/')
            if [ "$top" != "$tag" ]; then
              echo "::error::Version ${version} is not greater than the latest release ${latest}. Bump app.Version."
              exit 1
            fi
          fi
          # Badge guard: the README release badge is dynamic (tracks the tag we cut,
          # so it will show ${version}). If the README instead pins a hardcoded
          # version badge, it must match the source version.
          badge=$(grep -oiP 'badge/[Vv]ersion-\K[0-9]+\.[0-9]+\.[0-9]+' README.md 2>/dev/null | head -1 || true)
          if [ -n "$badge" ] && [ "$badge" != "$version" ]; then
            echo "::error::README version badge ${badge} != source version ${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Tag
        if: steps.v.outputs.skip != '1'
        run: |
          git config user.name "nano-git-db"
          git config user.email "release@nano-git-db.local"
          git tag -a "v${{ steps.v.outputs.version }}" -m "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
      - name: goreleaser
        if: steps.v.outputs.skip != '1'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Windows single-file .exe installer(s), built from the binaries goreleaser
      # just cross-compiled into dist/ (NSIS runs on Linux, no wine), then attached
      # to the release goreleaser created.
      - name: Windows installers
        if: steps.v.outputs.skip != '1'
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          bash cicd/utility/windows-installer.bash "${{ steps.v.outputs.version }}"
          gh release upload "v${{ steps.v.outputs.version }}" dist/*setup.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
