# Release packaging for the public binary. Pure-Go, so every OS/arch below
# cross-compiles from one Linux box with no C toolchain. Produces: binaries for
# linux/darwin/windows/freebsd (amd64+arm64), .deb/.rpm for linux (nfpm), a
# tar.gz/zip archive per target, and checksums. The Windows single-file .exe
# installer is built separately (cicd/utility/windows-installer.bash, NSIS).
# Deferred (need the target OS's own tooling/signing host): macOS .dmg, Windows
# .msi, FreeBSD .pkg - those ship as archives for now.
# app.Version is authoritative in source; only app.CommitTime is stamped, which
# gives the build number. No build date, so release binaries show none.
version: 2
project_name: gitniblet

builds:
  - id: gitniblet
    dir: source
    main: ./cmd/gitniblet
    binary: gitniblet
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=vendor
      - -trimpath
    ldflags:
      - -s -w -X github.com/yottacore/gitniblet/app.CommitTime={{ .CommitTimestamp }}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]  # flow-style so cicd.bash --no-arm can filter this line
    # Commit time, not build time, so 2 builds of one commit match byte for byte.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: gitniblet
    formats: [tar.gz]
    name_template: "gitniblet-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    # The default globs, spelled out so each file gets the commit's time.
    files:
      - src: README.md
        info: {mtime: "{{ .CommitDate }}"}
      - src: license.md
        info: {mtime: "{{ .CommitDate }}"}
      - src: changelog.md
        info: {mtime: "{{ .CommitDate }}"}
    format_overrides:
      - goos: windows
        formats: [zip]

# nfpm packages only the linux builds (it ignores the other OSes automatically).
nfpms:
  - id: gitniblet
    package_name: gitniblet
    formats: [deb, rpm]
    maintainer: gitniblet maintainers <release@gitniblet.local>
    description: Local-first database on an append-only, git-syncable transaction log.
    license: AGPL-3.0-or-later
    mtime: "{{ .CommitDate }}"
    homepage: https://github.com/yottacore/gitniblet
    bindir: /usr/bin
    contents:
      - src: ./license.md
        dst: /usr/share/doc/gitniblet/license.md
        file_info: {mtime: "{{ .CommitDate }}"}
      - src: ./README.md
        dst: /usr/share/doc/gitniblet/README.md
        file_info: {mtime: "{{ .CommitDate }}"}

checksum:
  name_template: checksums.txt

release:
  # The same first line as --version. release.yml sets GITNIBLET_BUILD.
  header: "gitniblet v{{ .Version }} build {{ .Env.GITNIBLET_BUILD }}"
  # -alpha/-beta/-rc tags land as a GitHub pre-release (not flagged Latest)
  prerelease: auto
  github:
    owner: jim-collier
    name: gitniblet
